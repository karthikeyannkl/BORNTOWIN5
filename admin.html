<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAGIZH Admin</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7f4;color:#173126;font-family:Arial,sans-serif}.app{max-width:430px;margin:auto;min-height:100vh;background:#fff}.hero{background:linear-gradient(145deg,#075f3b,#0c8050);color:#fff;padding:27px 20px;border-radius:0 0 25px 25px}.brand{font-size:28px;font-weight:900}.sub{opacity:.8}.card{background:#fff;border:1px solid #e4ebe6;border-radius:20px;padding:16px;margin:14px 16px;box-shadow:0 7px 20px #17312610}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px}.tile{border:0;border-radius:18px;padding:20px 12px;text-align:left;background:#f1f7f3;color:#124b34;font-weight:800;font-size:16px}.tile span{display:block;font-size:28px;margin-bottom:9px}.input{width:100%;padding:13px;border:1px solid #d7dfda;border-radius:12px;margin:7px 0 10px}.btn{width:100%;border:0;border-radius:13px;padding:13px;background:#075f3b;color:#fff;font-weight:800;margin-top:8px}.hidden{display:none}.note{font-size:12px;color:#69776f;line-height:1.5}.bottom{position:sticky;bottom:0;background:#fff;border-top:1px solid #e8ece9;padding:9px;display:grid;grid-template-columns:1fr 1fr}.bottom button{border:0;background:transparent;font-weight:800;color:#075f3b;padding:10px}
</style></head><body><div class="app"><section class="hero"><div class="brand">MAGIZH ADMIN</div><div class="sub">Unified Control Center</div></section><div id="login" class="card"><h2>Admin Login</h2><input id="user" class="input" value="admin" placeholder="User ID"><input id="pass" class="input" type="password" value="ADMIN" placeholder="Password"><button class="btn" onclick="loginAdmin()">Login</button><div id="msg" class="note"></div></div><div id="dash" class="hidden"><div class="card"><div class="note">Control Center</div><h2 style="margin:5px 0">Choose Module</h2><div class="note">Each module opens as a full page so its internal mobile layout can scroll normally.</div></div><div class="grid"><button class="tile" onclick="openM('product_admin.html')"><span>🛍️</span>Product Admin</button><button class="tile" onclick="openM('referral_admin.html')"><span>👥</span>Referral Admin</button><button class="tile" onclick="openM('level_admin.html')"><span>📈</span>Level Tracking</button></div><div class="card"><button class="btn" onclick="logout()">Logout</button></div></div><div class="bottom"><button onclick="location.href='index.html'">Customer Side</button><button onclick="logout()">Admin Logout</button></div></div><script>function loginAdmin(){if(user.value.trim()!=='admin'||pass.value!=='ADMIN'){msg.textContent='Invalid admin login.';return}sessionStorage.setItem('MAGIZH_MASTER_ADMIN','1');login.classList.add('hidden');dash.classList.remove('hidden')}function openM(p){sessionStorage.setItem('MAGIZH_MASTER_ADMIN','1');location.href=p}function logout(){sessionStorage.removeItem('MAGIZH_MASTER_ADMIN');location.reload()}if(sessionStorage.getItem('MAGIZH_MASTER_ADMIN')==='1'){login.classList.add('hidden');dash.classList.remove('hidden')}</script></body></html>
